<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Pet Desktop Avatar Demo</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17221e;
        --panel: rgba(250, 249, 242, 0.86);
        --line: rgba(35, 51, 44, 0.14);
        --warm: #c47d45;
        --leaf: #416c59;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        color: var(--ink);
        font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 16% 18%, rgba(255, 237, 199, 0.9), transparent 24%),
          radial-gradient(circle at 76% 8%, rgba(116, 164, 146, 0.42), transparent 30%),
          linear-gradient(135deg, #ecf3e8 0%, #d6e3d8 42%, #f2e9da 100%);
      }

      .desktop {
        position: relative;
        width: 100vw;
        height: 100vh;
        isolation: isolate;
      }

      .desktop::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.22) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.18) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, transparent 0, black 22%, black 82%, transparent 100%);
      }

      .desktop::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        height: 170px;
        z-index: -1;
        background: linear-gradient(to top, rgba(41, 51, 44, 0.2), transparent);
      }

      .menubar {
        position: absolute;
        top: 12px;
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 34px;
        padding: 0 14px;
        border: 1px solid rgba(255, 255, 255, 0.48);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.34);
        box-shadow: 0 16px 42px rgba(34, 48, 41, 0.12);
        backdrop-filter: blur(22px);
        font-size: 13px;
        font-weight: 700;
      }

      .menubar span {
        opacity: 0.72;
      }

      .ghost-window {
        position: absolute;
        top: 112px;
        left: 88px;
        width: min(420px, calc(100vw - 176px));
        height: 276px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.24);
        box-shadow: 0 24px 70px rgba(31, 48, 42, 0.12);
        backdrop-filter: blur(18px);
      }

      .ghost-window::before,
      .ghost-window::after {
        content: "";
        position: absolute;
        left: 22px;
        right: 22px;
        height: 11px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.4);
      }

      .ghost-window::before {
        top: 44px;
        width: 58%;
      }

      .ghost-window::after {
        top: 76px;
        width: 74%;
      }

      .dock {
        position: absolute;
        left: 50%;
        bottom: 20px;
        display: flex;
        gap: 12px;
        transform: translateX(-50%);
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.48);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.34);
        box-shadow: 0 18px 54px rgba(24, 36, 31, 0.18);
        backdrop-filter: blur(22px);
      }

      .dock i {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.66), rgba(255, 255, 255, 0.08)),
          var(--c);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }

      .pet-window {
        position: absolute;
        right: clamp(26px, 7vw, 128px);
        bottom: clamp(70px, 12vh, 112px);
        width: min(44vw, 420px);
        min-width: 260px;
        aspect-ratio: 1 / 1.05;
        pointer-events: auto;
      }

      .pet-shadow {
        position: absolute;
        left: 18%;
        right: 10%;
        bottom: 2%;
        height: 13%;
        border-radius: 50%;
        background:
          radial-gradient(ellipse at center, rgba(19, 27, 23, 0.28), rgba(19, 27, 23, 0.12) 44%, transparent 72%);
        filter: blur(6px);
        transform: rotate(-3deg);
        animation: shadow-breathe 4.2s ease-in-out infinite;
      }

      .pet-cutout {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
        filter: drop-shadow(0 18px 22px rgba(26, 38, 31, 0.18));
        transform-origin: 50% 86%;
        animation: pet-breathe 4.2s ease-in-out infinite;
        will-change: transform, filter;
      }

      .pet-window:hover .pet-cutout {
        filter: drop-shadow(0 20px 24px rgba(26, 38, 31, 0.2)) saturate(1.04);
        animation-duration: 2.6s;
      }

      .attention {
        position: absolute;
        top: 17%;
        left: 13%;
        width: 13px;
        height: 13px;
        border-radius: 999px;
        background: #f6f0d8;
        box-shadow:
          26px -18px 0 5px rgba(246, 240, 216, 0.82),
          52px -35px 0 1px rgba(246, 240, 216, 0.66);
        opacity: 0.82;
        animation: thought 4.6s ease-in-out infinite;
      }

      .speech {
        position: absolute;
        right: min(41vw, 392px);
        bottom: clamp(330px, 44vh, 450px);
        max-width: min(320px, calc(100vw - 54px));
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.62);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 18px 48px rgba(27, 39, 33, 0.16);
        backdrop-filter: blur(18px);
        line-height: 1.45;
      }

      .speech strong {
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
      }

      .speech span {
        display: block;
        color: rgba(23, 34, 30, 0.72);
        font-size: 13px;
      }

      .speech::after {
        content: "";
        position: absolute;
        right: -10px;
        bottom: 18px;
        width: 18px;
        height: 18px;
        border-right: 1px solid rgba(255, 255, 255, 0.62);
        border-bottom: 1px solid rgba(255, 255, 255, 0.62);
        background: inherit;
        transform: rotate(-45deg);
      }

      .status-chip {
        position: absolute;
        right: clamp(28px, 7vw, 126px);
        bottom: clamp(58px, 9vh, 82px);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border: 1px solid rgba(255, 255, 255, 0.54);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.44);
        box-shadow: 0 14px 34px rgba(25, 37, 32, 0.13);
        backdrop-filter: blur(18px);
        font-size: 13px;
        font-weight: 700;
      }

      .status-chip i {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background: var(--leaf);
        box-shadow: 0 0 0 5px rgba(65, 108, 89, 0.14);
      }

      @keyframes pet-breathe {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1) rotate(-0.3deg);
        }
        50% {
          transform: translate3d(0, -8px, 0) scale(1.012, 0.996) rotate(0.25deg);
        }
      }

      @keyframes shadow-breathe {
        0%,
        100% {
          transform: rotate(-3deg) scale(1);
          opacity: 0.92;
        }
        50% {
          transform: rotate(-3deg) scale(0.94);
          opacity: 0.72;
        }
      }

      @keyframes thought {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.45;
        }
        45% {
          transform: translateY(-7px);
          opacity: 0.86;
        }
      }

      @media (max-width: 820px) {
        .ghost-window {
          left: 24px;
          width: calc(100vw - 48px);
          height: 210px;
        }

        .speech {
          left: 24px;
          right: auto;
          bottom: 48vh;
        }

        .speech::after {
          right: 30px;
          bottom: -9px;
          transform: rotate(45deg);
        }

        .pet-window {
          right: 50%;
          bottom: 82px;
          width: min(72vw, 360px);
          transform: translateX(50%);
        }

        .status-chip {
          right: 50%;
          transform: translateX(50%);
        }

        .dock i:nth-child(n + 6) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="desktop" aria-label="AI Pet desktop avatar demo">
      <div class="menubar">
        <span>AI Pet</span>
        <span>Sat May 30 16:05</span>
      </div>

      <div class="ghost-window" aria-hidden="true"></div>

      <aside class="speech" aria-label="pet message">
        <strong>Mochi</strong>
        <span>我在桌面上等你。刚同步到早餐剩余 20g。</span>
      </aside>

      <section class="pet-window" aria-label="Mochi desktop pet">
        <div class="attention" aria-hidden="true"></div>
        <div class="pet-shadow" aria-hidden="true"></div>
        <img class="pet-cutout" src="./mochi-corgi-cutout.png" alt="Mochi, a realistic corgi desktop pet" />
      </section>

      <div class="status-chip"><i></i><span>active twin</span></div>

      <nav class="dock" aria-hidden="true">
        <i style="--c: #416c59"></i>
        <i style="--c: #c47d45"></i>
        <i style="--c: #6f91a8"></i>
        <i style="--c: #d9b768"></i>
        <i style="--c: #8b7666"></i>
        <i style="--c: #9f6358"></i>
        <i style="--c: #567568"></i>
      </nav>
    </main>
  </body>
</html>
