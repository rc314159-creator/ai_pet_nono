<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Pet Photo Desktop Pet</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="stage" class="mode-idle" aria-label="AI Pet photo-real desktop pet">
      <div class="drag-zone" title="拖动移动桌宠"></div>
      <button class="close-button" type="button" aria-label="关闭">×</button>
      <div class="speech" aria-live="polite"></div>
      <div class="pet-wrap">
        <div class="pet-shadow" aria-hidden="true"></div>
        <canvas class="pet-canvas" width="520" height="520" aria-label="Mochi photo-real frame animated desktop pet"></canvas>
      </div>
    </main>
    <script src="./runtime.js"></script>
  </body>
</html>
