<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Pet Speech Bubble</title>
    <style>
      :root {
        color-scheme: light;
        --ink: rgba(24, 31, 28, 0.86);
        --paper: rgba(255, 253, 244, 0.9);
        --edge: rgba(255, 255, 255, 0.66);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
      }

      .bubble {
        position: absolute;
        inset: 10px 12px 18px;
        display: grid;
        align-items: center;
        min-height: 52px;
        padding: 11px 14px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 18px 44px rgba(24, 31, 28, 0.18);
        opacity: 0;
        transform: translateY(8px) scale(0.98);
        backdrop-filter: blur(18px);
      }

      .bubble.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
        animation: bubble-in 180ms ease-out both;
      }

      .bubble::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        border-right: 1px solid var(--edge);
        border-bottom: 1px solid var(--edge);
        background: inherit;
        transform: rotate(45deg);
      }

      .bubble.placement-above::after,
      .bubble.placement-below::after {
        left: calc(50% - 8px);
        bottom: -8px;
      }

      .bubble.placement-left::after {
        right: -8px;
        bottom: 28px;
      }

      .bubble.placement-right::after {
        left: -8px;
        bottom: 28px;
        transform: rotate(225deg);
      }

      .bubble-text {
        margin: 0;
        max-height: 150px;
        overflow: hidden;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.48;
        letter-spacing: 0;
        white-space: pre-wrap;
        word-break: break-word;
      }

      @keyframes bubble-in {
        0% {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <section id="bubble" class="bubble placement-above" aria-live="polite">
      <p id="bubbleText" class="bubble-text"></p>
    </section>
    <script>
      const bubble = document.querySelector("#bubble");
      const bubbleText = document.querySelector("#bubbleText");

      function showBubble(payload) {
        const text = typeof payload?.text === "string" ? payload.text : "";
        const placement = typeof payload?.placement === "string" ? payload.placement : "above";
        bubbleText.textContent = text;
        bubble.className = `bubble placement-${placement}`;
        bubble.classList.remove("visible");
        window.requestAnimationFrame(() => bubble.classList.add("visible"));
      }

      function hideBubble() {
        bubble.classList.remove("visible");
        bubbleText.textContent = "";
      }

      window.desktopPhotoPetBubble?.onShow?.(showBubble);
      window.desktopPhotoPetBubble?.onHide?.(hideBubble);
    </script>
  </body>
</html>
